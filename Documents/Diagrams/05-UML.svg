<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="900" viewBox="0 0 1180 900" font-family="Segoe UI, Arial, sans-serif">
  <style>
    .ttl   { font-size: 26px; font-weight: 700; fill: #1e5a96; text-anchor: middle; }
    .layer { fill: none; stroke-width: 2; stroke-dasharray: 7 5; }
    .layt  { font-size: 16px; font-weight: 700; text-anchor: end; }
    .cls   { fill: #ffffff; stroke: #1e5a96; stroke-width: 2; }
    .clsh  { fill: #1e5a96; }
    .clsht { font-size: 14px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    .m     { font-size: 11.5px; fill: #33475b; }
    .rel   { stroke: #6b7f95; stroke-width: 1.8; fill: none; }
    .inh   { stroke: #2e7d4f; stroke-width: 1.8; fill: none; }
    .note  { font-size: 12.5px; fill: #6b7f95; text-anchor: middle; }
  </style>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#6b7f95"/>
    </marker>
    <marker id="tri" markerWidth="13" markerHeight="12" refX="12" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#ffffff" stroke="#2e7d4f" stroke-width="1.6"/>
    </marker>
  </defs>

  <text class="ttl" x="590" y="34">תרשים מחלקות UML  שכבות השרת</text>

  <!-- ============ layer bands ============ -->
  <rect class="layer" x="40" y="60"  width="1100" height="140" rx="8" stroke="#c0392b"/>
  <text class="layt" x="1128" y="82" fill="#c0392b">Controllers  שירותי אינטרנט</text>

  <rect class="layer" x="40" y="225" width="1100" height="180" rx="8" stroke="#c77b1f"/>
  <text class="layt" x="1128" y="247" fill="#c77b1f">BusinessLogic  לוגיקה עסקית</text>

  <rect class="layer" x="40" y="430" width="1100" height="230" rx="8" stroke="#1e5a96"/>
  <text class="layt" x="1128" y="452" fill="#1e5a96">ViewModel  גישה לנתונים</text>

  <rect class="layer" x="40" y="685" width="1100" height="150" rx="8" stroke="#2e7d4f"/>
  <text class="layt" x="1128" y="707" fill="#2e7d4f">Model  ישויות</text>

  <!-- ============ Controllers ============ -->
  <g transform="translate(70,95)">
    <rect class="cls" x="0" y="0" width="215" height="88" rx="4"/>
    <rect class="clsh" x="0" y="0" width="215" height="26" rx="4"/><rect class="clsh" x="0" y="16" width="215" height="10"/>
    <text class="clsht" x="107" y="18">ClientsController</text>
    <text class="m" x="8" y="45">+ Login()</text>
    <text class="m" x="8" y="62">+ Register()</text>
    <text class="m" x="8" y="79">+ GetAll()</text>
  </g>
  <g transform="translate(325,95)">
    <rect class="cls" x="0" y="0" width="215" height="88" rx="4"/>
    <rect class="clsh" x="0" y="0" width="215" height="26" rx="4"/><rect class="clsh" x="0" y="16" width="215" height="10"/>
    <text class="clsht" x="107" y="18">ClassesController</text>
    <text class="m" x="8" y="45">+ GetSchedule()</text>
    <text class="m" x="8" y="62">+ Add()  + Update()</text>
    <text class="m" x="8" y="79">+ Cancel()</text>
  </g>
  <g transform="translate(580,95)">
    <rect class="cls" x="0" y="0" width="215" height="88" rx="4"/>
    <rect class="clsh" x="0" y="0" width="215" height="26" rx="4"/><rect class="clsh" x="0" y="16" width="215" height="10"/>
    <text class="clsht" x="107" y="18">ClassTypesController</text>
    <text class="m" x="8" y="45">+ GetAll()  + Add()</text>
    <text class="m" x="8" y="62">+ Update()</text>
    <text class="m" x="8" y="79">+ Delete()</text>
  </g>
  <g transform="translate(835,95)">
    <rect class="cls" x="0" y="0" width="215" height="88" rx="4"/>
    <rect class="clsh" x="0" y="0" width="215" height="26" rx="4"/><rect class="clsh" x="0" y="16" width="215" height="10"/>
    <text class="clsht" x="107" y="18">BookingsController</text>
    <text class="m" x="8" y="45">+ GetMyBookings()</text>
    <text class="m" x="8" y="62">+ Book()  + Cancel()</text>
    <text class="m" x="8" y="79">+ ChangeStatus()</text>
  </g>

  <!-- ============ BusinessLogic ============ -->
  <g transform="translate(90,262)">
    <rect class="cls" x="0" y="0" width="240" height="122" rx="4" stroke="#c77b1f"/>
    <rect x="0" y="0" width="240" height="26" rx="4" fill="#c77b1f"/><rect x="0" y="16" width="240" height="10" fill="#c77b1f"/>
    <text class="clsht" x="120" y="18">ClientBL</text>
    <text class="m" x="8" y="45">- clientVM : ClientVM</text>
    <text class="m" x="8" y="66">+ LoginAsync()</text>
    <text class="m" x="8" y="83">+ RegisterAsync()</text>
    <text class="m" x="8" y="100">- IsValidPhone()</text>
    <text class="m" x="8" y="117">בדיקת תקינות והצפנת סיסמה</text>
  </g>
  <g transform="translate(455,262)">
    <rect class="cls" x="0" y="0" width="255" height="122" rx="4" stroke="#c77b1f"/>
    <rect x="0" y="0" width="255" height="26" rx="4" fill="#c77b1f"/><rect x="0" y="16" width="255" height="10" fill="#c77b1f"/>
    <text class="clsht" x="127" y="18">ClassBL</text>
    <text class="m" x="8" y="45">- classVM : ClassVM</text>
    <text class="m" x="8" y="66">+ GetScheduleForClientAsync()</text>
    <text class="m" x="8" y="83">+ AddClassAsync()</text>
    <text class="m" x="8" y="100">- ValidateClassAsync()</text>
    <text class="m" x="8" y="117">בדיקת התנגשות אולם ותאריך</text>
  </g>
  <g transform="translate(835,262)">
    <rect class="cls" x="0" y="0" width="255" height="122" rx="4" stroke="#c77b1f"/>
    <rect x="0" y="0" width="255" height="26" rx="4" fill="#c77b1f"/><rect x="0" y="16" width="255" height="10" fill="#c77b1f"/>
    <text class="clsht" x="127" y="18">BookingBL</text>
    <text class="m" x="8" y="45">- bookingVM : BookingVM</text>
    <text class="m" x="8" y="66">+ BookClassAsync()</text>
    <text class="m" x="8" y="83">+ CancelMyBookingAsync()</text>
    <text class="m" x="8" y="100">+ ChangeStatusAsync()</text>
    <text class="m" x="8" y="117">בדיקת תפוסה, כפילות והרשאה</text>
  </g>

  <!-- ============ ViewModel ============ -->
  <g transform="translate(430,462)">
    <rect class="cls" x="0" y="0" width="300" height="72" rx="4"/>
    <rect class="clsh" x="0" y="0" width="300" height="26" rx="4"/><rect class="clsh" x="0" y="16" width="300" height="10"/>
    <text class="clsht" x="150" y="18">DBconnect   (מחלקת בסיס)</text>
    <text class="m" x="8" y="45"># connectionString : string</text>
    <text class="m" x="8" y="63"># OpenConnectionAsync() : SqlConnection</text>
  </g>

  <g transform="translate(60,570)">
    <rect class="cls" x="0" y="0" width="235" height="78" rx="4"/>
    <rect class="clsh" x="0" y="0" width="235" height="26" rx="4"/><rect class="clsh" x="0" y="16" width="235" height="10"/>
    <text class="clsht" x="117" y="18">ClientVM</text>
    <text class="m" x="8" y="45">+ LoginAsync()</text>
    <text class="m" x="8" y="62">+ AddClientAsync()</text>
  </g>
  <g transform="translate(320,570)">
    <rect class="cls" x="0" y="0" width="235" height="78" rx="4"/>
    <rect class="clsh" x="0" y="0" width="235" height="26" rx="4"/><rect class="clsh" x="0" y="16" width="235" height="10"/>
    <text class="clsht" x="117" y="18">ClassTypeVM</text>
    <text class="m" x="8" y="45">+ GetAllAsync()</text>
    <text class="m" x="8" y="62">+ AddAsync()  + DeleteAsync()</text>
  </g>
  <g transform="translate(600,570)">
    <rect class="cls" x="0" y="0" width="245" height="78" rx="4"/>
    <rect class="clsh" x="0" y="0" width="245" height="26" rx="4"/><rect class="clsh" x="0" y="16" width="245" height="10"/>
    <text class="clsht" x="122" y="18">ClassVM</text>
    <text class="m" x="8" y="45">+ GetScheduleAsync()</text>
    <text class="m" x="8" y="62">+ IsRoomBusyAsync()</text>
  </g>
  <g transform="translate(880,570)">
    <rect class="cls" x="0" y="0" width="235" height="78" rx="4"/>
    <rect class="clsh" x="0" y="0" width="235" height="26" rx="4"/><rect class="clsh" x="0" y="16" width="235" height="10"/>
    <text class="clsht" x="117" y="18">BookingVM</text>
    <text class="m" x="8" y="45">+ GetByClientAsync()</text>
    <text class="m" x="8" y="62">+ UpdateStatusAsync()</text>
  </g>

  <!-- ============ Model ============ -->
  <g transform="translate(70,725)">
    <rect class="cls" x="0" y="0" width="200" height="86" rx="4" stroke="#2e7d4f"/>
    <rect x="0" y="0" width="200" height="26" rx="4" fill="#2e7d4f"/><rect x="0" y="16" width="200" height="10" fill="#2e7d4f"/>
    <text class="clsht" x="100" y="18">Client</text>
    <text class="m" x="8" y="45">+ ClientID : int</text>
    <text class="m" x="8" y="62">+ FullName : string</text>
    <text class="m" x="8" y="79">+ IsManager : bool</text>
  </g>
  <g transform="translate(310,725)">
    <rect class="cls" x="0" y="0" width="200" height="86" rx="4" stroke="#2e7d4f"/>
    <rect x="0" y="0" width="200" height="26" rx="4" fill="#2e7d4f"/><rect x="0" y="16" width="200" height="10" fill="#2e7d4f"/>
    <text class="clsht" x="100" y="18">ClassType</text>
    <text class="m" x="8" y="45">+ TypeID : int</text>
    <text class="m" x="8" y="62">+ TypeName : string</text>
    <text class="m" x="8" y="79">+ DurationMinutes : int</text>
  </g>
  <g transform="translate(550,725)">
    <rect class="cls" x="0" y="0" width="230" height="86" rx="4" stroke="#2e7d4f"/>
    <rect x="0" y="0" width="230" height="26" rx="4" fill="#2e7d4f"/><rect x="0" y="16" width="230" height="10" fill="#2e7d4f"/>
    <text class="clsht" x="115" y="18">GymClass</text>
    <text class="m" x="8" y="45">+ ClassID : int   + TypeID : int</text>
    <text class="m" x="8" y="62">+ ClassDate : DateTime</text>
    <text class="m" x="8" y="79">+ FreePlaces : int  {מחושב}</text>
  </g>
  <g transform="translate(820,725)">
    <rect class="cls" x="0" y="0" width="230" height="86" rx="4" stroke="#2e7d4f"/>
    <rect x="0" y="0" width="230" height="26" rx="4" fill="#2e7d4f"/><rect x="0" y="16" width="230" height="10" fill="#2e7d4f"/>
    <text class="clsht" x="115" y="18">Booking</text>
    <text class="m" x="8" y="45">+ BookingID : int</text>
    <text class="m" x="8" y="62">+ ClientID : int  + ClassID : int</text>
    <text class="m" x="8" y="79">+ Status : string</text>
  </g>

  <!-- ============ Controller -> BL ============ -->
  <path class="rel" d="M177,183 L200,256" marker-end="url(#a)"/>
  <path class="rel" d="M432,183 L520,256" marker-end="url(#a)"/>
  <path class="rel" d="M687,183 L620,256" marker-end="url(#a)"/>
  <path class="rel" d="M942,183 L955,256" marker-end="url(#a)"/>

  <!-- ============ BL -> VM ============ -->
  <path class="rel" d="M190,384 L178,564" marker-end="url(#a)"/>
  <path class="rel" d="M560,384 L470,564" marker-end="url(#a)"/>
  <path class="rel" d="M600,384 L700,564" marker-end="url(#a)"/>
  <path class="rel" d="M960,384 L995,564" marker-end="url(#a)"/>

  <!-- ============ inheritance VM -> DBconnect ============ -->
  <path class="inh" d="M177,570 L177,545 L430,510" marker-end="url(#tri)"/>
  <path class="inh" d="M437,570 L437,545 L428,528" marker-end="url(#tri)"/>
  <path class="inh" d="M722,570 L722,545 L734,528" marker-end="url(#tri)"/>
  <path class="inh" d="M997,570 L997,545 L735,510" marker-end="url(#tri)"/>

  <text class="note" x="590" y="880">חצים ירוקים = ירושה: כל מחלקות ה-ViewModel יורשות מ-DBconnect ומקבלות ממנה את החיבור למסד.  חצים אפורים = שימוש בין שכבות.</text>
</svg>
